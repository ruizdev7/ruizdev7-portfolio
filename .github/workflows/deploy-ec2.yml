name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version/tag to deploy
        id: set_version
        run: |
          TAG="${{ github.event.workflow_run.head_sha }}"
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "🚀 Deploying version: $TAG"

      - name: Setup SSH key properly
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Escribir la llave usando printf para interpretar \n correctamente
          printf '%b\n' "${{ secrets.EC2_SSH_KEY_PORTFOLIO }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Verificar formato y contar líneas
          echo "🔍 Verificando formato de la llave..."
          LINES=$(wc -l < ~/.ssh/deploy_key)
          echo "Líneas detectadas: $LINES"
          
          if head -1 ~/.ssh/deploy_key | grep -q "BEGIN"; then
            echo "✅ Formato correcto detectado"
            head -1 ~/.ssh/deploy_key
            tail -1 ~/.ssh/deploy_key
          else
            echo "❌ ERROR: Formato de llave inválido"
            echo "La llave debe comenzar con -----BEGIN ... KEY-----"
            exit 1
          fi
          
          # Configurar SSH config
          cat > ~/.ssh/config << EOF
          Host ec2-deploy
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh ec2-deploy "echo '✅ Conexión SSH exitosa'"

      - name: Deploy to EC2
        run: |
          ssh ec2-deploy bash << 'ENDSSH'
            set -e
            
            echo "🔐 Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            cd /home/ubuntu/Documents/GitHub/ruizdev7-portfolio

            echo "📥 Updating deployment configuration..."
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            DOCS_DIR=/home/ubuntu/Documents/GitHub/ruizdev7_portfolio_docs
            if [ -d "$DOCS_DIR/.git" ]; then
              git -C "$DOCS_DIR" pull --ff-only origin main
            else
              git clone https://github.com/ruizdev7/ruizdev7_portfolio_docs.git "$DOCS_DIR"
            fi
            
            if [ ! -f .env ] || [ ! -f backend/.env.production ]; then
              echo "❌ Production environment files are missing"
              exit 1
            fi

            echo "📝 Selecting image version: ${{ env.VERSION_TAG }}"
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ env.VERSION_TAG }}|" .env
            
            echo "📥 Pulling new images..."
            docker compose -f docker-compose.production.yml pull backend frontend

            echo "📚 Building documentation..."
            docker compose -f docker-compose.production.yml build docs
            
            echo "🔄 Restarting services (MySQL will start automatically if not running)..."
            docker compose -f docker-compose.production.yml up -d
            
            echo "✅ Deployment complete!"
            docker compose -f docker-compose.production.yml ps
          ENDSSH
