name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version/tag to deploy
        id: set_version
        run: |
          TAG="${{ github.event.workflow_run.head_sha }}"
          echo "VERSION_TAG=$TAG" >> $GITHUB_ENV
          echo "🚀 Deploying version: $TAG"

      - name: Setup SSH key properly
        run: |
          SSH_KEY="$RUNNER_TEMP/ec2_deploy_key"
          SSH_CONFIG="$RUNNER_TEMP/ec2_ssh_config"

          # Escribir la llave usando printf para interpretar \n correctamente
          printf '%b\n' "${{ secrets.EC2_SSH_KEY_PORTFOLIO }}" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"
          
          # Verificar formato y contar líneas
          echo "🔍 Verificando formato de la llave..."
          LINES=$(wc -l < "$SSH_KEY")
          echo "Líneas detectadas: $LINES"
          
          if head -1 "$SSH_KEY" | grep -q "BEGIN"; then
            echo "✅ Formato correcto detectado"
          else
            echo "❌ ERROR: Formato de llave inválido"
            echo "La llave debe comenzar con -----BEGIN ... KEY-----"
            exit 1
          fi
          
          # Usar una configuración temporal para no modificar ~/.ssh/config del runner.
          cat > "$SSH_CONFIG" << EOF
          Host ec2-deploy
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USER }}
            Port 22
            IdentityFile $SSH_KEY
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
            ConnectTimeout 15
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$SSH_CONFIG"

      - name: Test SSH connection from self-hosted runner
        run: |
          if ! SSH_OUTPUT=$(ssh -F "$RUNNER_TEMP/ec2_ssh_config" -o BatchMode=yes ec2-deploy "echo '✅ Conexión SSH exitosa'" 2>&1); then
            echo "$SSH_OUTPUT"
            echo "❌ No fue posible conectar desde el runner self-hosted."
            echo "Verifica que tu Mac pueda ejecutar SSH hacia EC2 y que su IP pública"
            echo "esté autorizada en el Security Group para TCP/22."
            exit 1
          fi

          echo "$SSH_OUTPUT"

      - name: Deploy to EC2
        run: |
          ssh -F "$RUNNER_TEMP/ec2_ssh_config" -o BatchMode=yes ec2-deploy bash << 'ENDSSH'
            set -e
            
            echo "🔐 Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            cd /home/ubuntu/Documents/GitHub/ruizdev7-portfolio

            echo "📥 Updating deployment configuration..."
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            DOCS_DIR=/home/ubuntu/Documents/GitHub/ruizdev7_portfolio_docs
            if [ -d "$DOCS_DIR/.git" ]; then
              git -C "$DOCS_DIR" pull --ff-only origin main
            else
              git clone https://github.com/ruizdev7/ruizdev7_portfolio_docs.git "$DOCS_DIR"
            fi
            
            if [ ! -f .env ] || [ ! -f backend/.env.production ]; then
              echo "❌ Production environment files are missing"
              exit 1
            fi

            echo "📝 Selecting image version: ${{ env.VERSION_TAG }}"
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ env.VERSION_TAG }}|" .env
            
            echo "📥 Pulling new images..."
            docker compose -f docker-compose.production.yml pull backend frontend

            echo "📚 Building documentation..."
            docker compose -f docker-compose.production.yml build docs
            
            echo "🔄 Restarting services (MySQL will start automatically if not running)..."
            docker compose -f docker-compose.production.yml up -d
            
            echo "✅ Deployment complete!"
            docker compose -f docker-compose.production.yml ps
          ENDSSH

      - name: Clean temporary SSH credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ec2_deploy_key" "$RUNNER_TEMP/ec2_ssh_config"
